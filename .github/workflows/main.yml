name: ACEest Fitness CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, lint and container tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py tests/test_app.py

      - name: Lint source and tests
        run: flake8 app.py tests/test_app.py

      - name: Build Docker image
        run: docker build --pull --tag aceest-fitness:ci .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:ci pytest -q
